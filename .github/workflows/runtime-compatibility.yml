# Disabled 2026-10-17: Matt does not use GitHub Actions; CI runs locally (see AGENTS.md).
name: Runtime Compatibility Drift

on:
  workflow_dispatch:
# Original triggers before 2026-10-17 (restore this block to re-enable):
#   on:
#     workflow_dispatch:
#     schedule:
#       - cron: "0 9 * * 1"

jobs:
  runtime-compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check runtime compatibility lock
        run: python scripts/check_runtime_compatibility.py --check-upstream
